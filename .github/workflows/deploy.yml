name: Deploy eplataformas.com al VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, vps-eplataformas]
    steps:
      - uses: actions/checkout@v7

      # `npm ci` y no `npm install`: el lockfile manda, para que el sitio que se
      # publica sea el que se probó y no el que resuelva npm ese día.
      - name: Instalar dependencias
        run: npm ci

      # `output: 'export'` (next.config.mjs) hace que `next build` deje el sitio
      # entero en `out/`. No hay `next start` ni proceso que reiniciar.
      - name: Compilar sitio estático
        run: npm run build

      # Control positivo ANTES de tocar producción: si el build no dejó un
      # index.html, el rsync con --delete vaciaría el sitio en vivo.
      - name: Comprobar que el build produjo algo
        run: |
          test -s out/index.html || { echo "ERROR: out/index.html no existe o está vacío"; exit 1; }
          # La página de reglas del programa de recomendación se comparte por enlace: si deja
          # de generarse (p. ej. se pierde `trailingSlash`), los enlaces ya enviados darían 404.
          test -s out/recomienda/index.html || { echo "ERROR: falta out/recomienda/index.html"; exit 1; }
          test -s out/aviso-de-privacidad/index.html || { echo "ERROR: falta out/aviso-de-privacidad/index.html"; exit 1; }
          echo "build OK — $(find out -type f | wc -l) archivos"

      - name: Sincronizar a /var/www/eplataformas
        run: |
          rsync -rlDzvc --delete --chown=www-data:www-data \
            out/ /var/www/eplataformas/

      # Se verifica POR LA ENTRADA PÚBLICA, y aquí SIN --resolve: el 2-oct-2026 el DNS apuntaba a
      # Vercel y la verificación vieja (--resolve al VPS) daba verde mientras los visitantes veían
      # otra copia (D55). Entrando por el DNS real, como un visitante, lo público tiene que ser
      # byte por byte el index.html recién construido.
      - name: Verificar por la entrada pública
        run: |
          set -u
          # Sin pipefail a propósito (curl | ... daba falsos negativos; ver ops/claude-hooks/ del meta-repo).
          ESPERADO=$(sha256sum out/index.html | cut -c1-64)
          for i in $(seq 1 30); do
            if [ "$(curl -sf -m 10 https://eplataformas.com/ | sha256sum | cut -c1-64)" = "$ESPERADO" ]; then
              echo "✓ eplataformas.com sirve, por su DNS público, el index.html de este commit"
              if curl -sf -m 10 https://eplataformas.com/recomienda/ | grep -q "Programa de recomendación" \
                 && curl -sf -m 10 https://eplataformas.com/aviso-de-privacidad/ | grep -q "derechos ARCO"; then
                echo "✓ /recomienda/ y /aviso-de-privacidad/ responden con su contenido"; exit 0
              fi
              echo "✗ /recomienda/ o /aviso-de-privacidad/ no responden con su contenido"; exit 1
            fi
            sleep 2
          done
          curl -sI -m 10 https://eplataformas.com/ | grep -i -E '^(HTTP|server):' || true
          echo "✗ eplataformas.com no sirve el index.html de este commit (¿el DNS apunta a otro lado?)"
          exit 1
